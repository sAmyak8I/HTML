<!DOCTYPE html>
<html>

<head>
    <title>Audio,vedio,map,poster Example</title>
</head>

<body>
    <h2>Audio Player</h2>
    <audio controls>
        <source src="/assets/Humnava Mere Jubin Nautiyal 320 Kbps.mp3" type="audio/mpeg"> Your browser does not support
        audio.
    </audio>

    <br><br>
    <h2>Video Player form web</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/BMzzXYQ8zoQ?si=LL0CfM09MlZ6l6yd"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <br><br>
    <h2>Video Player</h2>
    <video width="500" height="300" controls poster="/assets/IMG_0117.JPG">
        <source src="/assets/sunna-zzz.3840x2160.mp4" type="video/mp4"> Your browser does not support video.
    </video>

    <br><br>
    <h2>map</h2>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d46321.02161932787!2d10.627260948632804!3d47.572098!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x479c5f145c571703%3A0xd15458b059d72ba0!2sEuropean%20Castles%20Tours!5e1!3m2!1sen!2sin!4v1781678681155!5m2!1sen!2sin"
        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
        <br><br>
        <h2>img</h2>
        <img src="/assets/IMG_0117.JPG" alt="cake" width="300" height="500">
</body>

</html>
