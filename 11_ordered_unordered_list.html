<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order List</title>
</head>

<body>
    <ol>  <!-- ordered list -->
         <li>luffy</li> 
        <li>zoro</li>
        <li>sanji</li>
    </ol>
    <ol type="A"><!-- ordered list with uppercase letters -->
        <li>Naruto</li>
        <li>sasuke</li>
        <li>kakashi</li>
    </ol>
    <ol type="i"><!-- ordered list with lowercase Roman numerals -->
        <li>yeno </li>
        <li>asta</li>
        <li>yami</li>
    </ol>
    <ol type="I"><!-- ordered list with uppercase Roman numerals -->
        <li>tanjiro</li>
        <li>zenitsu</li>
        <li>inosuke</li>
    </ol>


    <ul><!-- unordered list -->
        <li>valorant</li>
        <li>counter strike</li>
        <li>COD</li>
    </ul>
    <ul type="square"><!-- unordered list with square bullets -->
        <li>cricket</li>
        <li>football</li>
        <li>boxing</li>
    </ul>
    <ul type="circle"><!-- unordered list with circle bullets -->
        <li>swimming</li>
        <li>vollyball</li>
        <li>tennis</li>
    </ul>
    <ul type="disc"><!-- unordered list with disc bullets -->
        <li>usa</li>
        <li>germany</li>
        <li>japan</li>
    </ul>

</body>

</html>
