<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h2>Student Registration Form</h2>
    <form action="#" method="post">
        <label for="name"> Student Name:</label>
        <input type="text" id="name" placeholder="student name" required><br><br>

        <label for="name">Father's Name:</label>
        <input type="text" id="name" placeholder="father's name" required><br><br>

        <label for="name">Mother's name:</label>
        <input type="text" id="name" placeholder="mother's name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="email" required><br><br>

        <label for="number">Phone Number:</label>
        <input type="tel" id="number" placeholder="phone number" required><br><br>

         <input type="radio" name="gender"> Male  
         <input type="radio" name="gender"> Female  

        <br><br> 
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required><br><br>

       <label for="course">Course:</label>
        <select id="course" required>
            <option value="">Select Course</option>
            <option value="bsc">B.Sc</option>
            <option value="bcom">B.Com</option>
            <option value="ba">B.A</option>
        </select><br><br>

       address:<br> 
        <textarea rows="5" cols="30" id="address" placeholder="Enter your address"></textarea><br><br>

        hobbies:<br>
        <input type="checkbox"> reading
        <input type="checkbox"> sports
         <input type="checkbox"> music
         <br><br>

         upload photo:
            <input type="file" id="photo" required><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
